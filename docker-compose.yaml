
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherops-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weatherops-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
