
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherops-backend
  namespace: weatherops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weatherops-backend
  template:
    metadata:
      labels:
        app: weatherops-backend
    spec:
      containers:
        - name: backend
          image: weather_ops-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
