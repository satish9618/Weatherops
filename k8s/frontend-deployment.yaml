
apiVersion: apps/v1
kind: Deployment

metadata:
  name: weatherops-frontend
  namespace: weatherops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: weatherops-frontend

  template:
    metadata:
      labels:
        app: weatherops-frontend

    spec:
      containers:
        - name: frontend
          image: weather_ops-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
