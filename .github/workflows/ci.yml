name: WeatherOps CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        run: python -m pytest tests/ -v

  build-and-deploy:
    name: Build, Push and Deploy to EKS
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            357660358977.dkr.ecr.us-east-1.amazonaws.com/weatherops-backend:latest
            357660358977.dkr.ecr.us-east-1.amazonaws.com/weatherops-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            357660358977.dkr.ecr.us-east-1.amazonaws.com/weatherops-frontend:latest
            357660358977.dkr.ecr.us-east-1.amazonaws.com/weatherops-frontend:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name weatherops-eks

      - name: Deploy backend
        run: |
          kubectl set image deployment/weatherops-backend \
            backend=357660358977.dkr.ecr.us-east-1.amazonaws.com/weatherops-backend:${{ github.sha }} \
            -n weatherops

      - name: Deploy frontend
        run: |
          kubectl set image deployment/weatherops-frontend \
            frontend=357660358977.dkr.ecr.us-east-1.amazonaws.com/weatherops-frontend:${{ github.sha }} \
            -n weatherops

      - name: Verify deployments
        run: |
          kubectl rollout status deployment/weatherops-backend -n weatherops --timeout=180s
          kubectl rollout status deployment/weatherops-frontend -n weatherops --timeout=180s
          kubectl get pods -n weatherops
